# @package _group_
batch_size: 4
val_batch_size: 1
num_workers: 3

train:
  indir: ${location.data_root_dir}/${location.train_subdir}
  out_size: 256
  kind: actual_mask
  transform_variant: default_map
  num_frames_to_skip: 1
  use_satellite: true
  satellite_shift_px: 2
  dataloader_kwargs:
    batch_size: ${data.batch_size}
    shuffle: True
    num_workers: ${data.num_workers}

val:
  indir: ${location.data_root_dir}/validate
  out_size: 256
  kind: actual_mask
  transform_variant: default_map_val
  num_frames_to_skip: 1
  use_satellite: true
  dataloader_kwargs:
    batch_size: ${data.val_batch_size}
    shuffle: False
    num_workers: ${data.num_workers}

visual_test:
  indir: ${location.data_root_dir}/validate
  out_size: 256
  kind: actual_mask
  transform_variant: default_map_val
  num_frames_to_skip: 1
  use_satellite: true
  dataloader_kwargs:
    batch_size: 1
    shuffle: False
    num_workers: ${data.num_workers}
