run_title: 'png-scratch'
seed: 42
pretrained_generator_path: null

evaluator:
  fid: false
  lpips: false
  ssim: true
  integral_kind: null

visualizer:
  key_order: [image, observation, predicted_image, inpainted]
  rescale_keys: []

optimizers:
  generator:
    lr: 0.0001
  discriminator:
    lr: 0.0001

training_model:
  kind: actual_mask
  visualize_each_iters: 500
  concat_mask: true
  condition_on_satellite: true
  satellite_dropout: 0
  store_discr_outputs_for_vis: false
losses:
  l1:
    weight_missing: 10
    weight_known: 1
  perceptual:
    weight: 0
  adversarial:
    kind: r1
    weight: 10
    gp_coef: 0.001
    mask_as_fake_target: true
    allow_scale_mask: true
  feature_matching:
    weight: 100
  resnet_pl:
    weight: 0
    weights_path: ${env:TORCH_HOME}

generator:
  kind: ffc_resnet
  input_nc: 5
  output_nc: 3
  ngf: 64
  n_downsampling: 3
  n_blocks: 18
  add_out_act: sigmoid
  init_conv_kwargs:
    ratio_gin: 0
    ratio_gout: 0
    enable_lfu: false
  downsample_conv_kwargs:
    ratio_gin: ${generator.init_conv_kwargs.ratio_gout}
    ratio_gout: ${generator.downsample_conv_kwargs.ratio_gin}
    enable_lfu: false
  resnet_conv_kwargs:
    ratio_gin: 0.75
    ratio_gout: ${generator.resnet_conv_kwargs.ratio_gin}
    enable_lfu: false

defaults:
  - location: docker
  - data: satellite-maps
  - discriminator: pix2pixhd_nlayer
  - optimizers: default_optimizers
  - visualizer: directory
  - evaluator: default_inpainted
  - trainer: png_single_gpu
  - hydra: overrides


png_data:
  root: null
  train_manifest: /home/ipa28/nobackup/autodelete/png_lama_prepared/train.json
  val_manifest: /home/ipa28/nobackup/autodelete/png_lama_prepared/validate.json
  crop_size: 512
  padding_max: 64
  satellite_shift_px: 2
  satellite_dropout: 0.1
  val_limit: 256
  preview_count: 8
